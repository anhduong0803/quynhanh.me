<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello Ann</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg1: #efe6ff;
      --bg2: #d9c6f5;
      --bg3: #c4b5ec;
      --ink: #2b1d45;
      --accent: #6a3fb5;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--ink);
      font-family: "Inter", system-ui, sans-serif;
      background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 50%, var(--bg3) 100%);
      background-size: 200% 200%;
      animation: drift 18s ease-in-out infinite;
      text-align: center;
    }
    @keyframes drift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    h1 {
      margin: 0;
      font-family: "Fraunces", Georgia, serif;
      font-weight: 300;
      font-size: clamp(3.5rem, 13vw, 9rem);
      line-height: 1;
      letter-spacing: -0.02em;
      animation: rise 1.2s ease-out both;
    }
    h1 em {
      font-style: italic;
      font-weight: 400;
      color: var(--accent);
    }
    .line {
      width: 56px;
      height: 2px;
      margin: 32px auto 20px;
      background: var(--accent);
      opacity: 0.6;
      animation: rise 1.2s 0.3s ease-out both;
    }
    p {
      margin: 0;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      opacity: 0.7;
      animation: rise 1.2s 0.5s ease-out both;
    }
    .enter {
      margin-top: 40px;
      padding: 10px 28px;
      border: 1px solid var(--accent);
      border-radius: 999px;
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      text-decoration: none;
      transition: background .2s, color .2s;
      animation: rise 1.2s 0.7s ease-out both;
    }
    .enter:hover { background: var(--accent); color: #fff; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to   { transform: translateY(0); }
    }
  </style>
</head>
<body>
  <h1>Hello <em>Ann</em></h1>
  <div class="line"></div>
  <p>quynhanh.me</p>
  <a class="enter" href="/market/">Enter</a>
</body>
</html>
